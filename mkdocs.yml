site_name: Cyborg Cats Wiki
site_description: Team 4256 Cyborg Cats knowledge base
repo_url: https://github.com/Team4256/4256-Wiki
repo_name: Team4256/4256-Wiki

theme:
  name: darkly

markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - fenced_code
  - pymdownx.arithmatex:
      generic: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Mechanical:
      - Overview: mechanical/index.md
      - Coordinate Systems and Tooling Basics: mechanical/coordinate-systems-and-tooling-basics.md
      - CAD/CAM: mechanical/cad-cam.md
      - Fabrication: mechanical/fabrication.md
  - Programming:
      - Overview: programming/index.md
      - Java Course: programming/java-course.md
      - Robot Code: programming/robot-code.md
      - Vision and Sensors: programming/vision-and-sensors.md
  - Electrical:
      - Overview: electrical/index.md
      - Wiring Basics: electrical/wiring-basics.md
      - Electrical Panel: electrical/electrical-panel.md
  - Releases & Writeups:
      - Overview: releases/index.md
      - Iterative Chinese Remainder Theorem for Absolute Turret Positioning: releases/crt.md
